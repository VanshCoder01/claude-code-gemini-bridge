name: CI & Build Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Syntax Check JavaScript
      run: |
        node --check src/proxy/index.js
        node --check src/proxy/server.js
        node --check src/proxy/config.js

    - name: Build Standalone Installer (CSC)
      run: |
        C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe /out:Installer.exe /target:exe /optimize+ installer/Installer.cs
        Get-Item Installer.exe

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Claude-Gemini-Installer
        path: Installer.exe
